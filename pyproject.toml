[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathofbuilding-mcp"
version = "0.6.0"
description = "MCP server that runs Path of Building Community's Lua calc engine headlessly"
readme = "README.md"
keywords = ["path-of-exile", "path-of-building", "mcp", "model-context-protocol", "poe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "lupa>=2.0", "pillow>=9.2", "highspy>=1.7", "numpy>=1.21"]

[project.scripts]
pathofbuilding-mcp = "pob_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pob_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/pob_mcp/bridge.lua" = "pob_mcp/bridge.lua"
"skills/pob-build-designer/SKILL.md" = "pob_mcp/skill/SKILL.md"
"skills/pob-build-designer/references" = "pob_mcp/skill/references"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["online: needs internet access (poe.ninja, pathofexile.com)"]

[project.urls]
Homepage = "https://github.com/wahid/pob-mcp"